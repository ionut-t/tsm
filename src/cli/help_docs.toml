# Curated tldr-style docs for the `tsm help` command palette.
#
# `tsm` entries only need examples (descriptions come from clap).
# `tmux` entries provide a short human `description` (the list column) plus
# examples (the preview). Argument syntax is pulled live from tmux, so it is
# not duplicated here.

# ---------------------------------------------------------------------------
# tsm commands
# ---------------------------------------------------------------------------

[[tsm]]
name = "new"
examples = [
  { info = "Create a session from a picked directory", cmd = "tsm new" },
  { info = "Named session at a specific path", cmd = "tsm new -n api -p ~/code/api" },
  { info = "Skip the success message", cmd = "tsm new -q" },
]

[[tsm]]
name = "kill"
examples = [
  { info = "Pick a session to kill", cmd = "tsm kill" },
  { info = "Kill a specific session", cmd = "tsm kill -s myproject" },
  { info = "Kill all sessions", cmd = "tsm kill -a" },
]

[[tsm]]
name = "rename"
examples = [
  { info = "Rename the current session", cmd = "tsm rename -n newname" },
  { info = "Rename a specific session", cmd = "tsm rename -c oldname -n newname" },
]

[[tsm]]
name = "switch"
examples = [
  { info = "Pick a session to switch to", cmd = "tsm switch" },
  { info = "Switch directly by name", cmd = "tsm switch -n myproject" },
]

[[tsm]]
name = "switch-window"
examples = [
  { info = "Pick a window across all sessions", cmd = "tsm switch-window" },
  { info = "Show a preview of window contents", cmd = "tsm switch-window --preview" },
]

[[tsm]]
name = "last-session"
examples = [
  { info = "Toggle to the last active session", cmd = "tsm last-session" },
]

[[tsm]]
name = "last-window"
examples = [
  { info = "Toggle to the last active window", cmd = "tsm last-window" },
  { info = "Restrict to the current session", cmd = "tsm last-window -c" },
]

[[tsm]]
name = "record"
examples = [
  { info = "Record the current window's access time", cmd = "tsm record" },
  { info = "Wire it into a tmux hook", cmd = "tmux set-hook -g after-select-window 'run-shell tsm record'" },
]

[[tsm]]
name = "move-window"
examples = [
  { info = "Interactively move a window to another session", cmd = "tsm move-window" },
  { info = "Move the current window to a session", cmd = "tsm move-window -t backend" },
  { info = "Move a specific window", cmd = "tsm move-window -f frontend:3 -t backend" },
]

[[tsm]]
name = "swap-window"
examples = [
  { info = "Swap the current window with window 3", cmd = "tsm swap-window -t 3" },
  { info = "Swap two specific windows", cmd = "tsm swap-window -s 2 -t 5" },
]

[[tsm]]
name = "workspace"
examples = [
  { info = "Pick and launch a workspace", cmd = "tsm workspace" },
  { info = "Launch a specific workspace", cmd = "tsm workspace myproject" },
  { info = "Create a new workspace", cmd = "tsm workspace new myproject" },
]

[[tsm]]
name = "completions"
examples = [
  { info = "Generate zsh completions", cmd = "tsm completions zsh" },
  { info = "Install them for zsh", cmd = "tsm completions zsh > ~/.zsh/completions/_tsm" },
]

[[tsm]]
name = "help"
examples = [
  { info = "Browse all tsm and tmux commands", cmd = "tsm help" },
  { info = "Bind it to a floating tmux popup", cmd = "bind ? display-popup -E 'tsm help'" },
]

