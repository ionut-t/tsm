# Isolated tmux config for the README demo (loaded with -f; never reads ~/.tmux.conf).

# Interactive bash reads the fake ~/.bashrc (neutral PS1) written by record.sh.
set -g default-command "bash --noprofile"
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off

# No hostname / pane titles anywhere: the default status-right shows the host.
set -g set-titles off
set -g allow-rename off
# Name windows after their directory (never the host); explicit names win.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Catppuccin Mocha-ish status bar
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[default] "
set -g status-right "#[fg=#6c7086]tsm demo "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded
set -g message-style "bg=#313244,fg=#cdd6f4"

# tsm bindings (same as the README)
bind o display-popup -E -w 80% -h 80% "tsm switch-window --preview"
bind O display-popup -E -w 40% -h 40% "tsm switch"
bind N display-popup -E -w 80% -h 80% "tsm new --preview"
bind L run-shell "tsm last-session"
bind l run-shell "tsm last-window"
bind W display-popup -E -w 50% -h 50% "tsm workspace"
bind ? display-popup -E -w 80% -h 80% "tsm help"

set-hook -g after-select-window 'run-shell "tsm record"'
